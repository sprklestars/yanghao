# 持续集成（CI）：每次 PR 更新、以及合并进 master 之后，自动跑一遍
# "代码层面的检查"，把结果挂在 PR 的 Checks 上。
#
# 设计取舍（重要）：
# 1) runner 用 windows-latest —— 和本机真实运行环境一致，避免"为了迎合 Linux
#    去改 Windows 行为"这种本末倒置。
# 2) 这里**不连真实账号/代理/平台**：需要真库、真网络的真机验证留在本机做。
#    数据库不可用时，相关用例会自动 skip（实测：227 passed / 5 skipped）。
# 3) 不跑 alembic upgrade head：CI 里没有 Postgres，建表校验属于本机步骤。

name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch: # 也可以在 Actions 页面手动点一次

concurrency: # 同一个分支连续推送时，取消上一次没跑完的
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: windows-latest
    env:
      # 只是让 Settings 能正常构造；CI 里没有这些服务，用例会自己跳过
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/osint
      DATABASE_URL_SYNC: postgresql://postgres:postgres@127.0.0.1:5432/osint
      REDIS_URL: redis://127.0.0.1:6379/0
      DEEPSEEK_API_KEY: ci-dummy-key
      TG_API_ID: "1234567"
      TG_API_HASH: "0123456789abcdef0123456789abcdef"
      TG_PROXY_URL: "" # CI 里直连（测试不发真实请求）
      API_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖（含 facebook / zalo 可选依赖）
        working-directory: backend
        # 适配器在模块顶层 import playwright / zlapi，不装会 ImportError；
        # 但不需要下载浏览器（测试里用的都是替身）
        run: pip install -e ".[dev,facebook,zalo]"

      - name: 静态检查
        working-directory: backend
        run: ruff check .

      - name: 单元测试
        working-directory: backend
        run: pytest -q

  frontend:
    name: frontend (tsc + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 构建
        working-directory: frontend
        run: npm run build
