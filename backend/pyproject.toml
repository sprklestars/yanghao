[project]
name = "osint-platform"
version = "0.1.0"
description = "OSINT Social Media Intelligence Gathering Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "openai>=1.58.0",
    "telethon>=1.38.0",
    # Telethon 走 proxy= 时需要有 SOCKS/HTTP 代理实现，缺失时报 No module named 'socks'。
    # Telethon 会优先使用 python-socks（异步），故显式声明，别依赖上游的隐式可选依赖。
    "python-socks[asyncio]>=2.4.4",
    "openpyxl>=3.1.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
facebook = [
    "playwright>=1.49.0",
    # 反检测脚本注入。用 2.x：1.x 依赖已被废弃的 pkg_resources，而 uv 建的
    # venv 不带 setuptools，装上会 ImportError。
    "playwright-stealth>=2.0.0",
]
zalo = [
    "zlapi>=1.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
